<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Initializing Agent</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            text-align: center;
            width: 80%;
            max-width: 600px;
        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-shadow: 0 0 10px #00ff41;
            margin-bottom: 20px;
        }

        .loader {
            width: 100%;
            height: 4px;
            background: #111;
            margin-top: 40px;
            position: relative;
            overflow: hidden;
        }

        .bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 50%;
            background: #00ff41;
            box-shadow: 0 0 20px #00ff41;
            animation: load 2s infinite ease-in-out;
        }

        @keyframes load {
            0% {
                left: -50%;
                width: 30%;
            }

            50% {
                left: 20%;
                width: 80%;
            }

            100% {
                left: 100%;
                width: 10%;
            }
        }

        .log {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #555;
            text-align: left;
            width: 100%;
            height: auto;
            min-height: 200px;
            background: #111;
            padding: 10px;
            border: 1px solid #333;
        }

        .blink {
            animation: blink 1s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>System Startup</h1>
        <div style="font-size: 0.8rem; letter-spacing: 2px; color: #00ff41;">
            BROWSER AGENT PROTOCOL v4.0 FINAL
        </div>

        <div class="loader">
            <div class="bar"></div>
        </div>

        <div class="log" id="console">
            <div style="color: #00ffff;">> System Ready. Waiting for initialization...</div>
        </div>
    </div>
    <script>
        const { ipcRenderer } = require('electron');
        const logContainer = document.getElementById('console');

        ipcRenderer.on('log-message', (_event, message) => {
            const div = document.createElement('div');
            div.textContent = `> ${message}`;
            div.style.color = '#00ff41';
            logContainer.appendChild(div);
            logContainer.scrollTop = logContainer.scrollHeight;

            if (logContainer.children.length > 50) {
                logContainer.removeChild(logContainer.firstChild);
            }
        });
    </script>
</body>

</html>
